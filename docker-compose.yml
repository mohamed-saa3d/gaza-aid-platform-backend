services:
  mongodb:
    image: mongo:7
    container_name: qaza-mongodb
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}).ok }',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: qaza-backend
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://mongodb:27017/qaza?replicaSet=rs0
    ports:
      - '3000:3000'

volumes:
  mongodb_data:
