version: '3.8'

services:
  qaza-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qaza_backend_prod
    restart: always
    ports:
      - '5000:5000'
    env_file:
      - .env
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:5000/api/settings || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
